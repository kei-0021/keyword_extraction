[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keyword-extraction"
version = "0.1.0"
dependencies = [
    "streamlit==1.51.0",
    "python-dotenv",
    "notion-client==2.2.1",
    "mecab-python3",
    "pandas",
    "plotly",
    "kaleido",
    "supabase",
    "gspread",
    "oauth2client",
    "pyright"
]

# default と test 環境を分けるためにプロジェクト内に仮想環境を置く設定は避ける
[tool.hatch.envs.default]
python = "3.11"
# path = ".venv"

[tool.hatch.envs.default.scripts]
app = "streamlit run main.py"
check = "pyright"

[project.optional-dependencies]
test = [
    "pytest",
]

# ここで test オプションを明示的にインストールする設定にする
[tool.hatch.envs.test]
dependencies = [
    "pytest",
]

# Pyright（Pylance）の詳細設定
[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
pythonPlatform = "Linux"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E203"]

[tool.hatch.build.targets.wheel]
packages = ["."]  # プロジェクトルートにあるファイルを対象にする設定